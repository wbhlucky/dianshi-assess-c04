[pytest]
markers =
    unit: 纯函数级，离线，毫秒级
    integration: 跨模块，读冻结 fixture 或真实资料包，离线
    golden: 与训练集标准答案逐行对齐，离线
    invariants: 对产物做属性断言
    eval: 真跑 pipeline + grade.py，可能调用模型
    network: 允许真实网络
    slow: 单条 >5s
    ec: 等价类标注，例如 @pytest.mark.ec("A1")
    case: 用例编号标注，例如 @pytest.mark.case("X18")
# --import-mode=importlib：unit/ 与 integration/ 各有一个 test_errors.py（同名不同层，
# 一个盯类层次与退出码分层，一个盯跨进程契约）。默认的 prepend 模式要求 basename 全局唯一，
# 会在收集阶段直接报 "import file mismatch"；importlib 模式按路径派生模块名，两者共存。
addopts = -m "not eval and not network and not slow" --strict-markers --import-mode=importlib -q
testpaths = tests
